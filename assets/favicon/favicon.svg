<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="fork-main" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>
  <!-- entry line -->
  <line x1="6" y1="50" x2="36" y2="50" stroke="#1e293b" stroke-width="7" stroke-linecap="round" />
  <circle cx="6" cy="50" r="3" fill="#1e293b" />
  <!-- triangular lens -->
  <polygon points="36,30 58,50 36,70" fill="#1e293b" opacity="0.1" />
  <polygon points="36,30 58,50 36,70" fill="none" stroke="#1e293b" stroke-width="7" stroke-linejoin="round" />
  <!-- amber fork -->
  <path d="M58,50 Q74,26 92,20" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" opacity="0.55" />
  <path d="M58,50 Q76,50 94,50" fill="none" stroke="url(#fork-main)" stroke-width="9.5" stroke-linecap="round" />
  <path d="M58,50 Q74,74 92,80" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" opacity="0.85" />
  <circle cx="92" cy="20" r="4" fill="#b45309" opacity="0.6" />
  <circle cx="94" cy="50" r="5" fill="#b45309" />
  <circle cx="92" cy="80" r="4" fill="#b45309" />
</svg>
