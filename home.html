---
---
<section class="intro">
  <h1>{{ page.title | default: site.title }}</h1>
  {{ content }}
</section>

<div class="ledger">
  {% for post in site.posts %}
    <a class="ledger__row" href="{{ post.url | relative_url }}">
      <span class="ledger__date">{{ post.date | date: "%d %b %Y" }}</span>
      <span class="ledger__title">{{ post.title }}</span>
      {% if post.categories.first %}
        <span class="tag">{{ post.categories.first }}</span>
      {% endif %}
    </a>
  {% endfor %}
</div>
