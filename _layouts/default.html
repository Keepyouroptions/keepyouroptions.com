<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;1,600;1,700&family=Literata:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/favicon/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/favicon/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/favicon/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">

  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">

  {% seo %}
  {% feed_meta %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-logo">
      {% include logo-mark.html size="30" %}
      <span class="site-logo-text">
        <span class="site-logo-main">Keep Your Options</span>
        <span class="site-logo-accent">Open.</span>
      </span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/' | relative_url }}">Ledger</a>
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
    </nav>
  </header>

  <main class="site-main" id="main-content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <span class="footer-tagline">{{ site.tagline }}</span>
    <span class="footer-links">
      <a href="{{ '/contact/' | relative_url }}">Contact</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/feed.xml' | relative_url }}" class="footer-rss">RSS</a>
    </span>
    <!--
      Follow-us links — replace REPLACE_ME_* with your real profile URLs, or
      delete any line for a platform you don't have.
    -->
    <span class="footer-social" aria-label="Follow us">
      <a href="https://twitter.com/REPLACE_ME_HANDLE">X</a>
      <a href="https://www.reddit.com/r/REPLACE_ME_SUBREDDIT">Reddit</a>
    </span>
  </footer>
</body>
</html>
